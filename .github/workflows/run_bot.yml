name: TradingAgents Hourly Analysis

on:
  schedule:
    # Run at the start of every hour (UTC)
    - cron: "0 * * * *"

  # Allows manual testing from GitHub Actions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Run TradingAgents
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ------------------------------------------------------
      # 1. Download repository
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # 2. Install Python
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ------------------------------------------------------
      # 3. Install TradingAgents
      # ------------------------------------------------------
      - name: Install TradingAgents
        run: |
          python -m pip install --upgrade pip
          pip install .


      # ------------------------------------------------------
      # 4. Run TradingAgents
      # ------------------------------------------------------
      - name: Run TradingAgents
        env:

          # ==================================================
          # GEMINI
          # ==================================================
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}


          # ==================================================
          # GROQ
          # ==================================================
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}


          # ==================================================
          # NVIDIA NIM
          # ==================================================
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}


          # ==================================================
          # TRADINGAGENTS
          # ==================================================

          # The provider is selected dynamically by
          # run_agent.py.
          #
          # Do NOT set TRADINGAGENTS_LLM_PROVIDER here,
          # because run_agent.py switches:
          #
          # Gemini → Groq → NVIDIA

          TRADINGAGENTS_MAX_DEBATE_ROUNDS: "1"
          TRADINGAGENTS_MAX_RISK_ROUNDS: "1"

          # Retry transient API errors a few times before
          # the provider fallback logic takes over.
          TRADINGAGENTS_LLM_MAX_RETRIES: "2"


        run: |
          python run_agent.py
```
