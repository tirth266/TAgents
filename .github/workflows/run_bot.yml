name: TradingAgents Hourly Analysis

on:
  schedule:
    # Run at the start of every hour (UTC)
    - cron: "0 * * * *"

  # Allows us to manually test the bot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Run TradingAgents
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      # ------------------------------------------------------
      # 1. Download our repository
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. Install Python
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ------------------------------------------------------
      # 3. Install TradingAgents
      # ------------------------------------------------------
      - name: Install TradingAgents
        run: |
          python -m pip install --upgrade pip
          pip install .

      # ------------------------------------------------------
      # 4. Run one AI market analysis
      # ------------------------------------------------------
      - name: Run TradingAgents
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SECRET_GOOGLE_KEY: ${{ secrets.GOOGLE_API_KEY }}

          TRADINGAGENTS_LLM_PROVIDER: google
          TRADINGAGENTS_DEEP_THINK_LLM: gemini-3.6-flash
          TRADINGAGENTS_QUICK_THINK_LLM: gemini-3.6-flash
          TRADINGAGENTS_MAX_DEBATE_ROUNDS: "1"
          TRADINGAGENTS_MAX_RISK_ROUNDS: "1"

        run: |
          python run_agent.py
