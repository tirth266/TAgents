name: TradingAgents Hourly Analysis

on:
  schedule:
    # Run at the start of every hour (UTC)
    - cron: "0 * * * *"

  # Allows manual testing from GitHub Actions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Run TradingAgents
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      # ------------------------------------------------------
      # 1. Download repository
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. Install Python
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ------------------------------------------------------
      # 3. Install TradingAgents
      # ------------------------------------------------------
      - name: Install TradingAgents
        run: |
          python -m pip install --upgrade pip
          pip install .

      # ------------------------------------------------------
      # 4. Run TradingAgents with Cerebras
      # ------------------------------------------------------
      - name: Run TradingAgents
        env:
          # Your GitHub Secret
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}

          # TradingAgents generic OpenAI-compatible provider
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SECRET_CEREBRAS_KEY: ${{ secrets.CEREBRAS_API_KEY }}

          # Provider
          TRADINGAGENTS_LLM_PROVIDER: openai_compatible

          # Cerebras OpenAI-compatible endpoint
          TRADINGAGENTS_LLM_BACKEND_URL: https://api.cerebras.ai/v1

          # Cerebras model
          TRADINGAGENTS_DEEP_THINK_LLM: gpt-oss-120b
          TRADINGAGENTS_QUICK_THINK_LLM: gpt-oss-120b

          # Keep first automated test lightweight
          TRADINGAGENTS_MAX_DEBATE_ROUNDS: "1"
          TRADINGAGENTS_MAX_RISK_ROUNDS: "1"

        run: |
          python run_agent.py
